<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARES, carta musicale</title>
<style>
:root{--bg:#06070e;--ink:#ece6d8;--dim:#8a87a3;--gold:#cfa95e;--line:rgba(207,169,94,.26)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#06070e}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -8%,#1b1735,var(--bg) 62%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));text-align:center}
h1{font-weight:400;letter-spacing:.6em;padding-left:.6em;margin:.1em 0 .1em;font-size:clamp(28px,8vw,46px)}
.sub{color:var(--dim);font-size:13px;letter-spacing:.04em}
#wheel{position:relative;width:min(100%,540px);aspect-ratio:1660/1624;margin:14px auto 2px}
#wheel img{width:100%;height:100%;object-fit:cover;display:block;-webkit-mask-image:radial-gradient(circle closest-side,#000 97%,transparent 100%);mask-image:radial-gradient(circle closest-side,#000 97%,transparent 100%)}
#glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#now{min-height:1.5em}
#moodT{font-size:clamp(26px,6vw,36px);font-style:italic;margin-top:10px}
#params{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px;margin:14px 0}
#params div{position:relative;padding:8px 2px 11px;border-top:1px solid var(--line);text-align:left}
#params span{display:block;font-size:12px;color:var(--dim)}
#params b{font-weight:400;font-size:18px}
#params i{position:absolute;left:0;bottom:-1px;height:1px;background:var(--gold);transition:width .6s}
.btn{font:inherit;color:var(--ink);background:none;border:1px solid var(--gold);border-radius:999px;padding:12px 24px;margin:4px;min-height:46px;cursor:pointer;touch-action:manipulation}
.btn:active{background:rgba(207,169,94,.16)}
.btn:focus-visible,.t:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#adv{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:14px 0 18px;font-size:13px;color:var(--dim)}
#adv label{display:flex;align-items:center;gap:8px}
#adv input,#adv select{background:#0d0c1a;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:inherit;font-size:15px;max-width:150px}
#adv input[type=range]{padding:0;width:110px;accent-color:var(--gold)}
#tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t{position:relative;overflow:hidden;font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:9px 2px;min-height:58px;cursor:pointer;touch-action:manipulation;transition:opacity .25s}
.t span{position:relative}
.t small{display:block;color:var(--dim);font-size:11px}
.t i{position:absolute;inset:0;background:var(--gold);opacity:0;pointer-events:none}
.t.off{opacity:.3}
.t.off span{text-decoration:line-through}
#fp{margin-top:22px}
@media(max-width:380px){.t{font-size:11px}}
@media(prefers-reduced-motion:reduce){#params i{transition:none}}
</style></head><body><main>
